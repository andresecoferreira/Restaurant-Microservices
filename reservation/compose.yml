version: '3.8'

services:
  # ============================================================
  # SHARED INFRASTRUCTURE (Owned by Reservation Service)
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"      # Internal listener (Docker containers)
      - "29092:29092"    # External listener (Host machine)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - project-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/clusters"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ============================================================
  # RESERVATION SERVICE INFRASTRUCTURE
  # ============================================================

  reservation_db:
    image: postgres:17
    restart: always
    env_file: ".env"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - project-network

  flyway:
    image: flyway/flyway:11.12
    depends_on:
      reservation_db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql
    command: >
      -url=jdbc:postgresql://$POSTGRES_DB:5432/$POSTGRES_DB
      -user=$POSTGRES_USER
      -password=$POSTGRES_PASSWORD
      migrate
    env_file: ".env"
    networks:
      - project-network

  # ============================================================
  # RESERVATION SERVICE APPLICATION
  # ============================================================

  reservation-service:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      reservation_db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: ".env"
    ports:
      - "8082:8082"
    volumes:
      - ./src:/app/src
      - ~/.m2:/root/.m2
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PORT: 8082
      APPLICATION_NAME: reservation-service
    networks:
      - project-network

# ============================================================
# VOLUMES
# ============================================================

volumes:
  db_data:

# ============================================================
# NETWORKS (Master network - created by this compose file)
# ============================================================

networks:
  project-network:
    driver: bridge
    name: shared-backend-network
