server:
  port: ${PORT:8081}

spring:
  application:
    name: ${APPLICATION_NAME:restaurant-service}

  datasource:
    url: jdbc:postgresql://${POSTGRES_DB:restaurant_db}:5432/${POSTGRES_DB:restaurant_db}
    username: ${POSTGRES_USER:project_user}
    password: ${POSTGRES_PASSWORD:project_secure_password_2024}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: filesystem:./migrations


feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: FULL
  hystrix:
    enabled: false

logging:
  level:
    pt.ulusofona.cd.project.shared.client: DEBUG
    feign: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

